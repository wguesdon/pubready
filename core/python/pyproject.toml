[project]
name = "pubready"
description = "Publication-ready figures with statistics, Python engine for pubready."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "William Guesdon", email = "wguesdon@gmail.com" }]
dynamic = ["version"]
dependencies = [
    "pandas",
    "numpy<2",
    "scipy",
    "matplotlib",
    "seaborn",
    "pingouin",
    "statannotations",
    "openpyxl",
    "pyyaml",
    "statsmodels",
    "scikit-posthocs",
    "lifelines",
    "PyComplexHeatmap",
    "upsetplot",
    "adjustText",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The engine is loaded from the runtime mount (PYTHONPATH), not installed into
# the image. This packaging exists for versioning, dependency declaration, and
# pytest. Version is single-sourced from pubready/version.py to stay in lockstep
# with the R DESCRIPTION, the root VERSION file, and the container image tag.
[tool.hatch.version]
path = "pubready/version.py"
pattern = "PUBREADY_VERSION = ['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["pubready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
