engine: r
recipe: two_group_compare
data:
  file: input_volume.csv
  x: group
  'y': volume
test:
  method: auto
  paired: no
  p_adjust: none
appearance:
  theme: pubready_house
  palette:
  - '#2E8B57'
  - '#7A5195'
  x_label: Group
  y_label: Tumor volume (mm^3)
  title: ~
  y_limits:
  - ~
  - ~
  show_points: yes
  geom: violin
  bracket:
    show: yes
    label: p.format
  scale: row
  cluster: both
  fc_cutoff: 1.0
  p_cutoff: 0.05
  top_n: 15.0
  pd_threshold: 20.0
  pr_threshold: -30.0
